# Dashboard-Karte fuer das Van-Netzwerk
# Einfuegen ueber: Dashboard -> Bearbeiten -> Rohkonfiguration

type: vertical-stack
cards:
  - type: entities
    title: Uplink
    entities:
      - entity: select.van_netzwerk_wan_modus
        name: Modus
      - entity: sensor.van_netzwerk_aktiver_uplink
        name: Aktiv
      - entity: binary_sensor.van_netzwerk_internet_verfuegbar
        name: Internet
      - type: divider
      - entity: sensor.van_netzwerk_verbundenes_wlan
        name: WLAN
      - entity: sensor.van_netzwerk_wlan_signal
        name: Signal
      - entity: sensor.van_netzwerk_wlan_geschwindigkeit
        name: WLAN gemessen
      - entity: sensor.mobilfunk_geschaetzter_durchsatz
        name: Mobilfunk geschaetzt
      - entity: sensor.van_uplink_empfehlung
        name: Empfehlung

  - type: conditional
    conditions:
      - condition: state
        entity: sensor.van_netzwerk_portal_status
        state: "manual"
    card:
      type: picture-entity
      entity: sensor.van_netzwerk_portal_status
      image: /local/van-net/portal_qr.png
      name: Portal mit Handy scannen
      show_state: false
      tap_action:
        action: none

  - type: entities
    title: Steuerung
    entities:
      - entity: button.van_netzwerk_jetzt_wlan_suchen
      - entity: button.van_netzwerk_portal_login_wiederholen
      - entity: button.van_netzwerk_speedtest_starten
      - type: divider
      - entity: binary_sensor.van_netzwerk_fahrzeug_steht
        name: Steht
      - entity: sensor.van_netzwerk_fahrzeuggeschwindigkeit
        name: Tempo
      - entity: sensor.van_netzwerk_letzter_scan
        name: Letzter Scan

  - type: entities
    title: Feinjustierung
    entities:
      - entity: input_boolean.van_suggest_5g_switch
      - entity: input_number.van_switch_threshold
      - entity: input_number.van_assumed_bandwidth
      - entity: input_number.van_cell_load_factor
      - entity: sensor.van_netzwerk_letzter_fehler

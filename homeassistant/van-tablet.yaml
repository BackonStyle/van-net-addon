# =============================================================================
# Dashboard "Tablet" -- fuer das Fire HD 10 im Fahrzeug
#
# Ablage:  /config/dashboards/van-tablet.yaml
#
# Eintragen in configuration.yaml unter lovelace.dashboards:
#
#   van-tablet:
#     mode: yaml
#     filename: dashboards/van-tablet.yaml
#     title: Tablet
#     icon: mdi:tablet-dashboard
#     show_in_sidebar: false      # nur per URL erreichbar
#
# Aufruf auf dem Tablet:  http://<ha-adresse>:8123/van-tablet/start
#
# Gegenueber der Seite "Internet" bewusst reduziert: grosse Flaechen fuer
# Finger, nur was man im Fahrzeug wirklich antippt. Feinjustierung und
# Diagnose bleiben auf dem Telefon.
# =============================================================================

title: Van
views:
  - title: Start
    path: start
    icon: mdi:home
    type: sections
    # Im Querformat passen mehr Spalten nebeneinander -- das ist der
    # wirksamste Hebel gegen Scrollen.
    max_columns: 4
    # Ohne dies richten sich alle Abschnitte an der hoechsten Zeile aus und
    # lassen darunter Luecken. Dicht gepackt ruecken kurze Abschnitte nach
    # oben in die Luecken nach.
    dense_section_placement: true
    dense_section_placement: true
    sections:

      # ------------------------------------------------ Status, gross
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Internet
            heading_style: title
            icon: mdi:web

          # Symbol und Farbe statt eines Wortes: auf einem Bildschirm, den man
          # im Vorbeigehen ansieht, zaehlt der erste Blick.
          - type: conditional
            conditions:
            - condition: state
              entity: sensor.van_netzwerk_aktiver_uplink
              state: wifi
            card:
              type: tile
              entity: sensor.van_netzwerk_aktiver_uplink
              name: WLAN
              icon: mdi:wifi
              color: green

          - type: conditional
            conditions:
            - condition: state
              entity: sensor.van_netzwerk_aktiver_uplink
              state: mobile
            card:
              type: tile
              entity: sensor.van_netzwerk_aktiver_uplink
              name: Mobilfunk
              icon: mdi:signal-cellular-3
              color: blue

          - type: conditional
            conditions:
            - condition: state
              entity: sensor.van_netzwerk_aktiver_uplink
              state_not: wifi
            - condition: state
              entity: sensor.van_netzwerk_aktiver_uplink
              state_not: mobile
            card:
              type: tile
              entity: sensor.van_netzwerk_aktiver_uplink
              name: Kein Internet
              icon: mdi:network-off
              color: red

          # Netzname nur, solange das WLAN auch wirklich traegt.
          - type: conditional
            conditions:
            - condition: state
              entity: sensor.van_netzwerk_aktiver_uplink
              state: wifi
            - condition: state
              entity: sensor.van_netzwerk_verbundenes_wlan
              state_not: ''
            - condition: state
              entity: sensor.van_netzwerk_verbundenes_wlan
              state_not: unknown
            - condition: state
              entity: sensor.van_netzwerk_verbundenes_wlan
              state_not: unavailable
            card:
              type: tile
              entity: sensor.van_netzwerk_verbundenes_wlan
              name: Netz
              icon: mdi:wifi-check
              color: green

          - type: tile
            entity: sensor.van_netzwerk_wlan_geschwindigkeit
            name: Tempo
            icon: mdi:speedometer

      # ------------------------------------------------ Umschalter
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Umschalten
            heading_style: subtitle
            icon: mdi:swap-horizontal

          - type: tile
            entity: select.van_netzwerk_wan_modus
            name: Uplink
            icon: mdi:swap-horizontal
            features_position: bottom
            features:
              - type: select-options

          - type: tile
            entity: select.van_netzwerk_sim_karte
            name: SIM
            icon: mdi:sim
            features_position: bottom
            features:
              - type: select-options

      # ------------------------------------------------ WLAN verbinden
      - type: grid
        cards:
          - type: heading
            heading: WLAN verbinden
            heading_style: subtitle
            icon: mdi:wifi-plus

          - type: tile
            entity: button.van_netzwerk_jetzt_wlan_suchen
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.van_netzwerk_jetzt_wlan_suchen
            name: Netze suchen
            icon: mdi:radar

          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.van_netzwerk_gefundenes_wlan
                name: Netz
              - entity: text.van_netzwerk_wlan_passwort
                name: Passwort

          - type: tile
            entity: button.van_netzwerk_mit_ausgewaehltem_wlan_verbinden
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.van_netzwerk_mit_ausgewaehltem_wlan_verbinden
            name: Verbinden
            icon: mdi:wifi-plus
            color: green

          - type: tile
            entity: sensor.van_netzwerk_verbindungsstatus
            name: Status
            icon: mdi:progress-wrench

      # ------------------------------------------------ QR nur bei Bedarf
      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.van_netzwerk_portal_status
                state: manual
            card:
              type: horizontal-stack
              cards:
                - type: picture-entity
                  entity: sensor.van_netzwerk_portal_status
                  image: /local/van-net/portal_qr.png
                  name: Anmeldeseite — mit dem Handy scannen
                  show_state: false
                  tap_action:
                    action: none
                - type: markdown
                  content: >-
                    ### Anmeldung offen


                    Code mit dem Handy scannen.
                    **Das Handy muss im Fahrzeug-WLAN bleiben** — über
                    Mobilfunk geöffnet wird nur das Handy freigeschaltet.

      # ------------------------------------------------ Mobilfunk kompakt
      - type: grid
        cards:
          - type: heading
            heading: Mobilfunk
            heading_style: subtitle
            icon: mdi:signal-cellular-3

          - type: tile
            entity: sensor.mobilfunk_geschaetzter_durchsatz
            name: Geschaetzt
            icon: mdi:signal-cellular-3
          - type: glance
            columns: 2
            entities:
              - entity: sensor.van_netzwerk_mobilfunk_netzmodus
                name: Netz
              - entity: sensor.van_netzwerk_mobilfunk_sinr
                name: SINR

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.van_netzwerk_modem_drosselt
                state: "on"
            card:
              type: tile
              entity: sensor.van_netzwerk_modemtemperatur
              name: Modem drosselt wegen Hitze
              icon: mdi:thermometer-alert
              color: red

      # ------------------------------------------------ Tablet selbst
      - type: grid
        cards:
          - type: heading
            heading: Tablet
            heading_style: subtitle
            icon: mdi:tablet

          # Erscheint nur, wenn die Ladung aus dem Schonbereich laeuft
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: sensor.fire_tablet_batterie
                    below: 25
                  - condition: numeric_state
                    entity: sensor.fire_tablet_batterie
                    above: 85
            card:
              type: tile
              entity: sensor.fire_tablet_batterie
              name: Akku ausserhalb des Schonbereichs
              icon: mdi:battery-alert
              color: orange

          # Fully Kiosk liefert den Bildschirm als Schalter, nicht als Licht --
          # die Helligkeit sitzt deshalb in einer eigenen Kachel daneben.
          - type: tile
            entity: switch.fire_tablet_bildschirm
            name: Bildschirm
            icon: mdi:monitor

          - type: tile
            entity: number.fire_tablet_bildschirmhelligkeit
            name: Helligkeit
            icon: mdi:brightness-6
            features_position: bottom
            features:
              - type: numeric-input
                style: slider

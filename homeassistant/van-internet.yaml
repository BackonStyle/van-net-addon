# =============================================================================
# Eigenstaendiges Dashboard "Internet"
#
# Ablage:  /config/dashboards/van-internet.yaml
#
# Eintragen in configuration.yaml:
#
#   lovelace:
#     mode: storage
#     dashboards:
#       van-internet:
#         mode: yaml
#         filename: dashboards/van-internet.yaml
#         title: Internet
#         icon: mdi:web
#         show_in_sidebar: true
#
# Das Installationsskript macht beides selbst.
#
# Dieses Dashboard erscheint als eigener Eintrag in der Seitenleiste und
# laesst dein vorhandenes Dashboard unberuehrt. Es ist dafuer NICHT ueber die
# Oberflaeche bearbeitbar -- Aenderungen gehen ueber diese Datei, danach
# Browser neu laden.
#
# Lieber als Seite im bestehenden Dashboard? Dann den Block unter 'views:'
# kopieren und dort ueber den Rohkonfigurations-Editor einhaengen.
#
# Verwendet ausschliesslich eingebaute Karten -- kein HACS.
# =============================================================================

title: Van
views:
- title: Internet
  path: internet
  icon: mdi:web
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Verbindung
      heading_style: title
      icon: mdi:transit-connection-variant
      badges:
      - type: entity
        entity: binary_sensor.van_netzwerk_internet_verfuegbar
        show_state: true
    # Das verbundene Netz steht oben und ueber die ganze Breite --
    # es ist die Angabe, die man unterwegs am haeufigsten sucht.
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_aktiver_uplink
        state: wifi
      - condition: state
        entity: sensor.van_netzwerk_verbundenes_wlan
        state_not: ''
      - condition: state
        entity: sensor.van_netzwerk_verbundenes_wlan
        state_not: unknown
      - condition: state
        entity: sensor.van_netzwerk_verbundenes_wlan
        state_not: unavailable
      card:
        type: tile
        entity: sensor.van_netzwerk_verbundenes_wlan
        name: Verbundenes Netz
        icon: mdi:wifi-check
        color: green
      grid_options:
        columns: 12
    - type: tile
      entity: select.van_netzwerk_wan_modus
      name: Uplink-Modus
      icon: mdi:swap-horizontal
      features_position: bottom
      features:
      - type: select-options
      grid_options:
        columns: 6
    # Drei sich ausschliessende Kacheln statt einer: so unterscheiden sich
    # WLAN und Mobilfunk auf einen Blick durch Symbol UND Farbe, nicht nur
    # durch ein Wort, das man lesen muss. Auf einem Tablet im Fahrzeug ist
    # das der Unterschied zwischen Hinsehen und Entziffern.
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_aktiver_uplink
        state: wifi
      card:
        type: markdown
        content: >
          <div style="text-align:center; font-size:1.35em; line-height:1.9">
          <ha-icon icon="mdi:wifi" style="color:var(--success-color); --mdc-icon-size:28px;
          vertical-align:-6px"></ha-icon>&nbsp;<b>WLAN</b></div>
      grid_options:
        columns: 6
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_aktiver_uplink
        state: mobile
      card:
        type: markdown
        content: >
          <div style="text-align:center; font-size:1.35em; line-height:1.9">
          <ha-icon icon="mdi:wifi-off" style="color:var(--error-color); --mdc-icon-size:28px;
          vertical-align:-6px"></ha-icon>&nbsp;<b>Mobilfunk</b></div>
      grid_options:
        columns: 6
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_aktiver_uplink
        state_not: wifi
      - condition: state
        entity: sensor.van_netzwerk_aktiver_uplink
        state_not: mobile
      card:
        type: markdown
        content: >
          <div style="text-align:center; font-size:1.35em; line-height:1.9">
          <ha-icon icon="mdi:network-off" style="color:var(--error-color); --mdc-icon-size:28px;
          vertical-align:-6px"></ha-icon>&nbsp;<b>Kein Internet</b></div>
      grid_options:
        columns: 6
    # Nur sichtbar, solange das WLAN wirklich die Internetquelle ist.
    # Signal und gemessenes Tempo gehoeren zur Verbindung -- aber nur,
    # solange das WLAN auch wirklich die Internetquelle ist.
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_aktiver_uplink
        state: wifi
      card:
        type: tile
        entity: sensor.van_netzwerk_wlan_signal
        name: WLAN-Signal
        icon: mdi:wifi
      grid_options:
        columns: 6
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_aktiver_uplink
        state: wifi
      card:
        type: tile
        entity: sensor.van_netzwerk_wlan_geschwindigkeit
        name: Gemessenes Tempo
        icon: mdi:speedometer
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.uplink_empfehlung
      name: Empfehlung
      icon: mdi:thumb-up-outline
      grid_options:
        columns: 6
    # Fuehrt auf die Unterseite mit dem kompletten Verbindungsablauf.
    # Dort steht, was man nur auf einem Campingplatz braucht.
    - type: tile
      entity: sensor.van_netzwerk_verbindungsstatus
      name: Mit einem Netz verbinden
      icon: mdi:wifi-plus
      tap_action:
        action: navigate
        navigation_path: /van-internet/wlan
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.van_netzwerk_letzter_fehler
      name: Werkzeuge
      icon: mdi:tools
      tap_action:
        action: navigate
        navigation_path: /van-internet/werkzeuge
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Mobilfunk
      heading_style: title
      icon: mdi:signal-cellular-3
      badges:
      - type: entity
        entity: sensor.van_netzwerk_mobilfunk_netzmodus
        show_state: true
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.van_netzwerk_modem_drosselt
        state: 'on'
      card:
        type: tile
        entity: sensor.van_netzwerk_modemtemperatur
        name: Modem drosselt wegen Hitze
        icon: mdi:thermometer-alert
        color: red
        hide_state: false
        vertical: false
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.van_netzwerk_modem_drosselt
        state: 'on'
      card:
        type: markdown
        text_only: true
        content: Zone **{{ states('sensor.van_netzwerk_thermikzone') }}** — der Router senkt Sendeleistung
          und Datenrate selbst. Der Mobilfunk ist dann langsamer als die Signalwerte vermuten lassen.
    - type: tile
      entity: select.van_netzwerk_sim_karte
      name: SIM-Karte
      icon: mdi:sim
      features_position: bottom
      features:
      - type: select-options
    - type: tile
      entity: sensor.mobilfunk_geschaetzter_durchsatz
      name: Geschaetzt
      icon: mdi:signal-cellular-3
    - type: tile
      entity: sensor.van_netzwerk_mobilfunk_sinr
      name: Qualitaet (SINR)
      icon: mdi:signal-variant
    - type: glance
      show_name: true
      show_state: true
      columns: 3
      entities:
      - entity: sensor.van_netzwerk_mobilfunk_rsrp
        name: RSRP
      - entity: sensor.van_netzwerk_mobilfunk_rsrq
        name: RSRQ
      - entity: sensor.van_netzwerk_mobilfunk_rssi
        name: RSSI
  - type: grid
    cards:
    - type: heading
      heading: Fahrzeug
      heading_style: title
      icon: mdi:van-passenger
      badges:
      - type: entity
        entity: binary_sensor.van_netzwerk_fahrzeug_steht
        show_state: true
    - type: map
      entities:
      - device_tracker.van_standort
      theme_mode: auto
      aspect_ratio: '4:3'
      default_zoom: 16
    # Ohne Himmelssicht gibt es keinen Fix und damit keinen Pin. Diese Kachel
    # erscheint nur dann und erklaert die leere Karte, statt sie wie einen
    # Defekt aussehen zu lassen.
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.van_netzwerk_gps_empfang
        state: "off"
      card:
        type: tile
        entity: sensor.van_netzwerk_gps_satelliten
        name: Kein GPS-Empfang — freie Sicht noetig
        icon: mdi:crosshairs-off
        color: orange
    # Eine Kachel statt zwei: der Wert ist die Anschrift, das Antippen loest
    # eine neue Abfrage aus. Der Zeitpunkt des letzten Drucks interessiert
    # niemanden -- die Adresse schon.
    - type: tile
      entity: sensor.van_adresse
      name: Standort abfragen
      icon: mdi:crosshairs-gps
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.van_netzwerk_standort_jetzt_abfragen
      grid_options:
        columns: 12
    - type: glance
      columns: 2
      entities:
      - entity: sensor.van_netzwerk_fahrzeuggeschwindigkeit
        name: Tempo
      - entity: sensor.van_netzwerk_letzter_scan
        name: Letzter Scan
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_portal_status
        state_not: idle
      card:
        type: heading
        heading: Anmeldeseite
        heading_style: subtitle
        icon: mdi:shield-account
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_portal_status
        state: manual
      card:
        type: picture-entity
        entity: sensor.van_netzwerk_portal_status
        image: /local/van-net/portal_qr.png
        name: Mit dem Handy scannen
        show_state: false
        show_name: true
        tap_action:
          action: none
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_portal_status
        state: manual
      card:
        type: markdown
        content: '**Handy im Fahrzeug-WLAN lassen.** Scannst du den Code ueber Mobilfunk, wird nur das Handy
          freigeschaltet, nicht der Router.'
        text_only: true
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_portal_status
        state_not: idle
      card:
        type: tile
        entity: button.van_netzwerk_portal_login_wiederholen
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.van_netzwerk_portal_login_wiederholen
        name: Automatik nochmal versuchen
        icon: mdi:login-variant

- title: WLAN verbinden
  path: wlan
  icon: mdi:wifi-plus
  # subview blendet die Seite aus der Navigation aus und zeigt stattdessen
  # einen Zurueck-Pfeil -- genau das Verhalten eines Fensters.
  subview: true
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Netz verbinden
      heading_style: subtitle
      icon: mdi:wifi-plus
    - type: entities
      show_header_toggle: false
      entities:
      - entity: button.van_netzwerk_jetzt_wlan_suchen
        name: 1 · Umgebung durchsuchen
        icon: mdi:radar
      - entity: select.van_netzwerk_gefundenes_wlan
        name: 2 · Netz waehlen
      - entity: text.van_netzwerk_wlan_passwort
        name: 3 · Passwort
      - entity: button.van_netzwerk_mit_ausgewaehltem_wlan_verbinden
        name: 4 · Verbinden
        icon: mdi:wifi-plus
      - type: divider
      - entity: sensor.van_netzwerk_verbindungsstatus
        name: Status
        icon: mdi:progress-wrench
      - type: section
        label: '*  Passwort bereits bekannt      #  verschluesselt'
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.van_netzwerk_basisstationen_im_netz
        above: 1
      card:
        type: entities
        show_header_toggle: false
        entities:
        - entity: button.van_netzwerk_beste_basisstation_suchen
          name: Beste Basisstation messen
          icon: mdi:access-point-network
        - entity: sensor.van_netzwerk_basisstationen_im_netz
          name: Gefunden
        - entity: sensor.van_netzwerk_gebundene_basisstation
          name: Gebunden an
        - type: section
          label: Misst hinter jeder Basisstation Latenz, Verlust und Durchsatz. Dauert rund eine Minute
            pro Station.

- title: Werkzeuge
  path: werkzeuge
  icon: mdi:tools
  subview: true
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Werkzeuge
      heading_style: subtitle
      icon: mdi:tools
    - type: tile
      entity: button.van_netzwerk_speedtest_starten
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.van_netzwerk_speedtest_starten
      name: Speedtest (nur WLAN)
      icon: mdi:speedometer
    # Eine Kachel statt zwei: sie zeigt das Datum der letzten Sicherung und
    # loest beim Antippen eine neue aus.
    - type: tile
      entity: sensor.van_netzwerk_letzte_router_sicherung
      name: Router sichern
      icon: mdi:content-save-cog
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.van_netzwerk_router_jetzt_sichern
    # Beide Kacheln oeffnen das Fenster des jeweiligen Skripts. Darin steht
    # genau ein Zahlenfeld fuer die PIN und ein Knopf zum Ausfuehren.
    - type: tile
      entity: script.van_router_neustart
      name: Router neu starten
      icon: mdi:restart-alert
      color: red
      tap_action:
        action: more-info
    - type: tile
      entity: script.van_pi_herunterfahren
      name: Pi herunterfahren
      icon: mdi:power
      color: red
      tap_action:
        action: more-info
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.van_netzwerk_letzter_fehler
        state_not: ''
      card:
        type: markdown
        content: '**Letzte Meldung:** {{ states(''sensor.van_netzwerk_letzter_fehler'') }}'

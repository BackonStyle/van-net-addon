# Debian-Basis statt der sonst ueblichen Alpine-Basis.
# Grund: Playwright/Chromium laeuft auf Alpine nicht zuverlaessig, und Debian
# liefert ein fertiges ARM64-Chromium fuer den Raspberry Pi mit.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
